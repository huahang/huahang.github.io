name: Jekyll Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs for the same ref.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Download a prebuilt Ruby instead of compiling it with rbenv/ruby-build.
      # Compiling Ruby 2.7 also needs OpenSSL 1.1 sources from openssl.org,
      # which made the build fail whenever that site was down.
      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          # Bundler >= 2.5 requires Ruby >= 3.2, so on Ruby 2.7 we must pin
          # to the last compatible release (2.4.22).
          bundler: "2.4.22"
          # Run `bundle install` and cache the gems in vendor/bundle.
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only deploy on pushes to master, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4